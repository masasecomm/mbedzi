<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Private live data view powered by KeywordCatch.">
  <title>Test | KeywordCatch</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="seo-page test-page">
  <header class="topbar">
    <div class="wrap topbar-row">
      <a href="index.html" class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        KeywordCatch
      </a>
      <nav class="topnav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="seo-page-header wrap test-header">
      <p class="kicker">Live data view</p>
      <h1>Test</h1>
      <p>The latest details are loaded through a private edge proxy and refreshed every minute.</p>
      <p class="test-status" id="sheetStatus" role="status">Loading latest details...</p>
    </section>

    <section class="wrap test-table-wrap">
      <div class="test-table-scroll">
        <table class="test-table" id="sheetTable">
          <caption class="visually-hidden">Latest details from the connected Google Sheet</caption>
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
      <p class="test-empty" id="sheetEmpty" hidden>No details are available yet.</p>
    </section>
  </main>

  <script>
    const table = document.getElementById('sheetTable');
    const tableHead = table.querySelector('thead');
    const tableBody = table.querySelector('tbody');
    const status = document.getElementById('sheetStatus');
    const empty = document.getElementById('sheetEmpty');
    const refreshMs = 60000;

    function parseCsv(text) {
      return text.trim().split(/\r?\n/).filter(Boolean).map(line => {
        const cells = [];
        let cell = '';
        let quoted = false;
        for (let index = 0; index < line.length; index += 1) {
          const character = line[index];
          if (character === '"' && line[index + 1] === '"' && quoted) {
            cell += '"';
            index += 1;
          } else if (character === '"') {
            quoted = !quoted;
          } else if (character === ',' && !quoted) {
            cells.push(cell.trim());
            cell = '';
          } else {
            cell += character;
          }
        }
        cells.push(cell.trim());
        return cells;
      });
    }

    function renderRows(rows) {
      tableHead.replaceChildren();
      tableBody.replaceChildren();
      if (!rows.length) {
        empty.hidden = false;
        return;
      }
      empty.hidden = true;
      const header = document.createElement('tr');
      rows[0].forEach(value => {
        const cell = document.createElement('th');
        cell.scope = 'col';
        cell.textContent = value;
        header.appendChild(cell);
      });
      tableHead.appendChild(header);
      rows.slice(1).forEach(row => {
        const tableRow = document.createElement('tr');
        row.forEach(value => {
          const cell = document.createElement('td');
          cell.textContent = value;
          tableRow.appendChild(cell);
        });
        tableBody.appendChild(tableRow);
      });
    }

    async function loadSheet() {
      try {
        const response = await fetch('/api/sheet', { cache: 'no-store' });
        if (!response.ok) throw new Error('The data proxy returned an error.');
        const contentType = response.headers.get('content-type') || '';
        const rows = contentType.includes('json')
          ? await response.json()
          : parseCsv(await response.text());
        renderRows(rows);
        status.textContent = `Updated ${new Date().toLocaleTimeString()}`;
      } catch (error) {
        status.textContent = 'The latest details could not be loaded.';
        empty.hidden = false;
        empty.textContent = 'Connect the Google Sheet URL in Cloudflare before using this page.';
      }
    }

    loadSheet();
    window.setInterval(loadSheet, refreshMs);
  </script>
</body>
</html>
